<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091326"><title>Quantum Resonance Lab</title><style>
:root{color-scheme:dark;--bg:#091326;--panel:#13233b;--line:#30445f;--text:#edf5ff;--muted:#a8bbd4;--teal:#68e0d1;--lav:#c1abff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#203758,transparent 48%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,select,input[type=number]{background:#1c304c;color:var(--text);border:1px solid #4b6582;border-radius:10px;padding:9px 11px}button{cursor:pointer}button:hover{border-color:var(--teal)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}button.active{background:#254e57;border-color:var(--teal)}header{max-width:1240px;margin:auto;padding:30px 20px 14px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}h1{font:clamp(38px,6vw,64px)/1.07 Georgia,serif;margin:12px 0}h2{font:29px Georgia,serif;margin:0 0 10px}h3{font:21px Georgia,serif;margin:12px 0 8px}p{color:var(--muted)}.lead{max-width:760px;font-size:18px}.layout{max-width:1240px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);gap:20px;padding:14px 20px 70px}nav{position:sticky;top:12px;align-self:start;background:#101e33;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:6px}nav button{text-align:left;background:transparent;border:0;padding:11px 12px}nav button.active{background:#22404d}.content{min-width:0}.panel{background:linear-gradient(145deg,#162841,#101c30);border:1px solid var(--line);border-radius:20px;padding:23px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{font-size:clamp(24px,3vw,36px);font-weight:750;color:var(--teal);font-variant-numeric:tabular-nums}.small{font-size:12px;color:var(--muted)}.tag{font-size:12px;border:1px solid #42667c;border-radius:30px;padding:4px 9px;color:var(--teal)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}label{font-size:13px;color:var(--muted)}input[type=range]{accent-color:var(--teal);width:min(100%,280px)}canvas{display:block;width:100%;height:245px;background:#0b1729;border:1px solid #263b58;border-radius:14px}svg{max-width:100%}.callout{background:#20354d;border-left:3px solid var(--teal);padding:12px 15px;border-radius:8px;margin:15px 0}.hidden{display:none!important}.lesson{border:1px solid var(--line);padding:15px;border-radius:13px;margin:10px 0}.lesson p{margin:6px 0}.lesson button{margin-top:8px}.math{font-family:Georgia,serif;color:#e6d4ff;font-size:22px}.progress{height:8px;background:#293b55;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--lav));width:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--teal)}.quiz-option{display:block;width:100%;text-align:left;margin:7px 0}.result{min-height:22px;color:var(--teal)}a{color:var(--teal)}footer{font-size:12px;color:var(--muted);padding:20px 0}.canvas-wrap{position:relative}.hint{color:#d9c9ff;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#1a2d46;border:1px solid var(--line);border-radius:13px;padding:15px}.pill{display:inline-block;background:#244354;border-radius:20px;padding:4px 10px;font-size:12px;color:var(--teal)}@media(max-width:850px){.layout{display:block;padding:12px 12px 60px}nav{position:relative;display:flex;overflow:auto;white-space:nowrap;margin-bottom:15px}nav button{flex-shrink:0}header{padding:24px 15px 8px}.grid,.three,.cards{grid-template-columns:1fr}.panel{padding:17px}canvas{height:210px}}
</style></head><body><header><div class="eyebrow">An interactive atlas of matter, energy, waves & time</div><h1>Quantum <span style="color:var(--lav)">Resonance</span> Lab</h1><p class="lead">Learn physics by experimenting. Explore waves, light, quantum energy, atomic transitions, timekeeping, and the mathematics that connects atoms to music.</p><span class="tag">Learning laboratory · Version 1.0</span></header><div class="layout"><nav aria-label="Main navigation" id="nav"></nav><main class="content" id="main"></main></div><script>
'use strict';
const c=299792458,h=6.62607015e-34,ev=1.602176634e-19,hydrogen=1420405751.768;
const modules=[
['overview','Observatory'],['paths','Learning Paths'],['waves','Wave Laboratory'],['spectrum','Light & Spectrum'],['atoms','Atomic Atlas'],['quantum','Quantum States'],['transitions','Transitions'],['clocks','Atomic Clocks'],['octaves','Octave Laboratory'],['math','Mathematics Studio'],['atlas','Knowledge Atlas'],['quiz','Discovery Challenges'],['notes','Research Notebook'],['references','Research Library']
];
const lessons=[
{group:'Foundations',title:'What is a physical quantity?',desc:'Units, measurements, scientific notation, and why dimensions matter.',body:'Physics begins with quantities we can define and measure. A frequency is a count of cycles per second; a wavelength is a distance. Equations must balance dimensions as well as numbers.'},
{group:'Waves',title:'Frequency and period',desc:'Why more cycles per second means less time per cycle.',body:'Frequency f is the number of cycles per second, measured in hertz. Period T is the duration of one cycle. Their relationship is T = 1/f. The same mathematics describes sound, oscillators, and electromagnetic radiation, but not all waves have the same physical mechanism.'},
{group:'Waves',title:'Superposition and interference',desc:'What happens when waves overlap?',body:'In a linear system, waves add. Two waves with matching phase reinforce one another; waves with opposing phase can cancel. When frequencies differ slightly, their sum creates beats.'},
{group:'Light',title:'Frequency, wavelength, and photons',desc:'Connect wave cycles to electromagnetic energy.',body:'In vacuum, electromagnetic wavelength λ and frequency f obey c = λf. The energy of a photon is E = hf. The constants c and h are exact in SI. These equations do not imply that light is an acoustic wave.'},
{group:'Atoms',title:'Elements, isotopes, and ions',desc:'What makes one atom different from another?',body:'An element is defined by its number of protons. Isotopes differ in neutron count. Ions differ in electron count. An element does not have a single characteristic transition frequency: atoms have many allowed energy levels.'},
{group:'Quantum',title:'Discrete quantum energy levels',desc:'Why atomic energies are not continuous.',body:'Bound quantum systems have particular allowed energy states. Transitions between states can absorb or emit photons, with energy differences related to frequency by ΔE = hf. Not every apparent pair of levels permits a radiative transition.'},
{group:'Spectroscopy',title:'Why atoms have spectral lines',desc:'Each line corresponds to a particular transition.',body:'A spectral line arises from a transition between specified energy states. A complete record identifies the element, ionization stage, upper and lower states, and observed or calculated wavelength or frequency.'},
{group:'Time',title:'How atomic clocks work',desc:'Using stable quantum transitions as references.',body:'An atomic clock compares a controllable oscillator with an atomic resonance and adjusts the oscillator through feedback. Cesium-133 defines the SI second using a hyperfine transition with frequency exactly 9,192,631,770 Hz.'},
{group:'Music',title:'Octave reduction and sonification',desc:'Translate a frequency mathematically into an audible register.',body:'An octave is a frequency factor of two. Dividing an electromagnetic transition frequency by 2^n can produce a numerical value in the audible range. Synthesizing that frequency creates a new sound; the atom itself is not making an audible tone.'},
{group:'Math',title:'Logarithms and enormous scales',desc:'Why logarithmic graphs help compare frequencies.',body:'Atomic frequencies span many orders of magnitude. On a logarithmic axis, equal distances represent equal multiplication factors. log₂(f₂/f₁) measures the number of octaves separating two frequencies.'}
];
const transitions=[
{symbol:'H',name:'Hydrogen',z:1,transition:'Neutral hydrogen 21-cm hyperfine',freq:hydrogen,source:'Radio astronomy reference',quality:'Reference approximate'},
{symbol:'Rb',name:'Rubidium',z:37,transition:'Rb-87 ground-state hyperfine',freq:6834682610.904,source:'Frequency standard reference',quality:'Approximate'},
{symbol:'Cs',name:'Cesium',z:55,transition:'Cs-133 ground-state hyperfine',freq:9192631770,source:'BIPM SI definition',quality:'Exact definition'}
];
const $=id=>document.getElementById(id),format=(n,d=7)=>Number(n).toLocaleString('en-US',{maximumSignificantDigits:d}),freqFmt=f=>f>=1e12?format(f/1e12)+' THz':f>=1e9?format(f/1e9)+' GHz':format(f)+' Hz';
let store;try{store=JSON.parse(localStorage.getItem('qrl-v1')||'{}')}catch{store={}}store.done??=[];store.answers??=[];store.notes??=[];const save=()=>{try{localStorage.setItem('qrl-v1',JSON.stringify(store))}catch{}};
function mount(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const m=$('main');m.replaceChildren();m.innerHTML=views[id]();if(init[id])init[id]();window.scrollTo({top:0,behavior:'instant'})}
const views={
overview:()=>`<section class="panel"><div class="eyebrow">Your scientific observatory</div><h2>Learn by asking better questions.</h2><p>Begin with a wave, follow the physics into an atom, and discover how a quantum transition can define a clock or inspire a musical pitch.</p><div class="grid three"><div class="card"><div class="small">Lessons completed</div><div class="metric">${store.done.length}/${lessons.length}</div></div><div class="card"><div class="small">Challenge attempts</div><div class="metric">${store.answers.length}</div></div><div class="card"><div class="small">Notebook entries</div><div class="metric">${store.notes.length}</div></div></div><h3>Learning progress</h3><div class="progress"><div style="width:${store.done.length/lessons.length*100}%"></div></div></section><section class="panel"><h2>Start exploring</h2><div class="cards"><div class="card"><h3>Wave Laboratory</h3><p>Manipulate two waves and discover interference.</p><button data-go="waves">Open experiment</button></div><div class="card"><h3>Atomic transitions</h3><p>Understand why elements have multiple spectral lines.</p><button data-go="transitions">Explore transitions</button></div><div class="card"><h3>Octave Laboratory</h3><p>Turn quantum transition frequencies into exact mathematical pitch ratios.</p><button data-go="octaves">Explore octave math</button></div><div class="card"><h3>Learning Paths</h3><p>Build the physics foundations in a guided sequence.</p><button data-go="paths">View curriculum</button></div></div></section>`,
paths:()=>`<section class="panel"><h2>Learning Paths</h2><p>Follow a progressive curriculum. Open any lesson, then mark it complete when you understand the central idea.</p><div id="lessonList"></div></section>`,
waves:()=>`<section class="panel"><h2>Wave Laboratory</h2><p>Experiment with two mathematical waves. The canvas shows their individual signals and their superposition. These are dimensionless demonstration signals, not a physical medium.</p><div class="grid"><div><label for="wf1">Wave A frequency: <b id="wf1v"></b> Hz</label><input id="wf1" type="range" min="1" max="12" step=".1" value="3"></div><div><label for="wf2">Wave B frequency: <b id="wf2v"></b> Hz</label><input id="wf2" type="range" min="1" max="12" step=".1" value="3.5"></div><div><label for="phase">Phase difference: <b id="phasev"></b>°</label><input id="phase" type="range" min="0" max="360" value="0"></div><div><label for="amp">Wave B amplitude: <b id="ampv"></b></label><input id="amp" type="range" min="0" max="2" step=".05" value="1"></div></div><canvas id="waveCanvas" role="img" aria-label="Two waves and their sum"></canvas><p class="small">Teal: wave A · Lavender: wave B · Gold: their sum. The display is a spatial-style schematic driven by the chosen frequency values.</p><div class="callout" id="waveInfo"></div><button id="waveReset">Reset experiment</button></section>`,
spectrum:()=>`<section class="panel"><h2>Electromagnetic Spectrum Navigator</h2><p>Move through the electromagnetic spectrum. The horizontal control is logarithmic: one step multiplies frequency by ten.</p><label for="logf">log₁₀(frequency in Hz): <b id="logfv"></b></label><input id="logf" type="range" min="3" max="22" step=".05" value="14.7" style="width:100%;max-width:100%"><div class="grid three"><div class="card"><div class="small">Frequency</div><div id="sFreq" class="metric"></div></div><div class="card"><div class="small">Vacuum wavelength</div><div id="sWave" class="metric"></div></div><div class="card"><div class="small">Photon energy</div><div id="sEnergy" class="metric"></div></div></div><div class="callout" id="sBand"></div><p class="math">c = λf &nbsp;·&nbsp; E = hf</p><p class="small">Band boundaries are conventional approximations and may overlap across references.</p></section>`,
atoms:()=>`<section class="panel"><h2>Atomic Atlas</h2><p>Elements are defined by proton number. Select a curated element to explore its identity and a documented example of a transition.</p><div class="controls"><label for="atomSelect">Element</label><select id="atomSelect"></select></div><div id="atomDetail"></div><div class="callout">A transition belongs to a particular quantum system, including its isotope, charge state, and selected energy levels. No element has one universal ticking frequency.</div></section>`,
quantum:()=>`<section class="panel"><h2>Quantum Energy States</h2><p>Explore the idealized hydrogen energy-level formula, Eₙ = −13.6 eV/n². This simplified nonrelativistic model omits fine structure, hyperfine structure, and other corrections.</p><div class="grid"><div><label for="upper">Upper principal level n: <b id="upperV"></b></label><input id="upper" type="range" min="2" max="8" value="3" step="1"></div><div><label for="lower">Lower principal level n: <b id="lowerV"></b></label><input id="lower" type="range" min="1" max="7" value="2" step="1"></div></div><svg id="energySvg" viewBox="0 0 600 270" role="img" aria-label="Hydrogen energy level diagram"></svg><div class="grid three"><div class="card"><div class="small">Photon energy</div><div class="metric" id="qEnergy"></div></div><div class="card"><div class="small">Frequency</div><div class="metric" id="qFreq"></div></div><div class="card"><div class="small">Vacuum wavelength</div><div class="metric" id="qWave"></div></div></div><div class="callout">This illustrates energy differences, not a literal electron trajectory. The computed values are model estimates, not precision spectroscopy.</div></section>`,
transitions:()=>`<section class="panel"><h2>Atomic Transitions</h2><p>Every spectral line corresponds to a specified energy difference. Explore the distinction between microwave hyperfine and optical electronic transitions.</p><div class="controls"><label for="transitionSel">Transition</label><select id="transitionSel"></select></div><div id="transitionDetail"></div><div class="callout">Absorption can move an atom into a higher energy state; emission can accompany a transition downward. Whether a radiative transition occurs depends on selection rules and other physics.</div><button data-go="quantum">Explore an energy-level model</button></section>`,
clocks:()=>`<section class="panel"><h2>Atomic Clock Laboratory</h2><p>An atomic clock stabilizes an oscillator by comparing it to an atomic resonance. Explore a conceptual feedback loop.</p><div class="grid three"><div class="card"><h3>1. Oscillator</h3><p>Generates a tunable signal.</p></div><div class="card"><h3>2. Atomic reference</h3><p>Provides a stable resonance.</p></div><div class="card"><h3>3. Feedback</h3><p>Corrects oscillator error.</p></div></div><label for="offset">Simulated oscillator offset: <b id="offsetV"></b> Hz</label><input id="offset" type="range" min="-100" max="100" step="1" value="35"><div class="grid"><div class="card"><div class="small">Cesium reference (exact SI definition)</div><div class="metric">9,192,631,770 Hz</div></div><div class="card"><div class="small">Illustrative oscillator</div><div class="metric" id="clockFreq"></div></div></div><div class="controls"><button id="correct">Apply ideal correction</button><button id="drift">Add +10 Hz offset</button></div><div class="callout">This is a simplified feedback illustration. Real clocks use interrogation sequences, error signals, noise control, and systematic-shift corrections.</div></section>`,
octaves:()=>`<section class="panel"><h2>Atomic Octave Reduction Laboratory</h2><p>Repeatedly divide a verified transition frequency by powers of two. This is mathematical sonification: the atom is not physically making sound.</p><div class="controls"><label for="octAtom">Transition</label><select id="octAtom"></select></div><div class="grid"><div><label for="octTarget">Lower bound of target octave: <b id="octTargetV"></b> Hz</label><input id="octTarget" type="range" min="110" max="880" step="1" value="440"></div><div><label for="octShift">Additional octave shift: <b id="octShiftV"></b></label><input id="octShift" type="range" min="-3" max="3" step="1" value="0"></div></div><div class="grid three"><div class="card"><div class="small">Original transition</div><div class="metric" id="originalF"></div></div><div class="card"><div class="small">Octaves divided</div><div class="metric" id="octCount"></div></div><div class="card"><div class="small">Calculated audible pitch</div><div class="metric" id="audibleF"></div></div></div><div id="octDetails" class="callout"></div><div class="controls"><button id="playTone">Play tone</button><button id="stopTone">Stop sound</button></div><p class="small">Audio begins only after you press Play. Output accuracy depends on browser audio implementation and device hardware. The synthesizer does not quantize to piano notes.</p></section>`,
math:()=>`<section class="panel"><h2>Mathematics Studio</h2><p>Build confidence with the equations that connect waves, photons, and musical intervals.</p><div class="cards"><div class="card"><h3>Period</h3><div class="math">T = 1/f</div><p>How long does one cycle take?</p></div><div class="card"><h3>Vacuum wavelength</h3><div class="math">λ = c/f</div><p>How far does light travel per cycle?</p></div><div class="card"><h3>Photon energy</h3><div class="math">E = hf</div><p>How much energy corresponds to a photon?</p></div><div class="card"><h3>Octave difference</h3><div class="math">n = log₂(f₂/f₁)</div><p>How many frequency doublings separate two values?</p></div></div><h3>Calculator</h3><div class="controls"><label for="mathFreq">Frequency in Hz</label><input id="mathFreq" type="number" min="0.000001" step="any" value="1420405751.768"></div><div id="mathOut" class="callout"></div></section>`,
atlas:()=>`<section class="panel"><h2>Knowledge Atlas</h2><p>Follow the chain of ideas connecting physics to the future atomic synthesizer. Select a concept to open its laboratory.</p><div class="cards" id="conceptCards"></div></section>`,
quiz:()=>`<section class="panel"><h2>Discovery Challenges</h2><p>Practice retrieval rather than recognition alone. Choose an answer and see an explanation.</p><div id="questionBox"></div><div class="top"><button id="nextQuestion">Next question</button><span id="score" class="pill"></span></div></section>`,
notes:()=>`<section class="panel"><h2>Scientific Research Notebook</h2><p>Record a hypothesis, a measurement, or a question. Notes remain in this browser unless you export them.</p><label for="noteText">New entry</label><textarea id="noteText" rows="5" style="width:100%;background:#0e1b2e;color:white;border:1px solid #4b6582;border-radius:12px;padding:12px" placeholder="What do you predict? What did you observe?"></textarea><div class="controls"><button id="saveNote">Save entry</button><button id="exportData">Export JSON backup</button><button id="clearNotes">Delete notebook entries</button></div><div id="noteList"></div><p class="small">Browser storage is local and not encrypted. Export backups to avoid losing your notes.</p></section>`,
references:()=>`<section class="panel"><h2>Research Library</h2><p>Foundational references for measurements, quantum transitions, and the definition of the second.</p><div class="lesson"><h3>NIST Atomic Spectra Database</h3><p>Evaluated atomic energy levels and spectral transitions.</p><a href="https://physics.nist.gov/asd" target="_blank" rel="noopener">Open NIST ASD</a></div><div class="lesson"><h3>BIPM — The SI Second</h3><p>Authoritative definition of the second and cesium reference.</p><a href="https://www.bipm.org/en/si-base-units/second" target="_blank" rel="noopener">Open BIPM</a></div><div class="lesson"><h3>NIST Physical Constants</h3><p>SI constants including c and h.</p><a href="https://physics.nist.gov/cuu/Constants/" target="_blank" rel="noopener">Open constants</a></div><div class="callout">Version 1 includes a small curated transition set and conceptual lessons. The full 88-transition dataset, uncertainty tracking, and advanced quantum solvers are future development phases, not completed features.</div></section>`
};
const init={
overview:()=>document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>mount(b.dataset.go)),
paths:()=>{const box=$('lessonList');lessons.forEach((l,i)=>{let el=document.createElement('details');el.className='lesson';el.innerHTML='<summary><strong>'+l.title+'</strong> <span class="small">· '+l.group+'</span> '+(store.done.includes(i)?'✓':'')+'</summary><p>'+l.desc+'</p><p>'+l.body+'</p><button type="button">'+(store.done.includes(i)?'Mark incomplete':'Mark complete')+'</button>';el.querySelector('button').onclick=()=>{store.done=store.done.includes(i)?store.done.filter(x=>x!==i):[...store.done,i];save();init.paths()};box.append(el)})},
waves:()=>{let canvas=$('waveCanvas'),ctx=canvas.getContext('2d');let raf;const render=()=>{const d=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,ht=canvas.clientHeight;canvas.width=w*d;canvas.height=ht*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,ht);const f1=+$('wf1').value,f2=+$('wf2').value,ph=+$('phase').value*Math.PI/180,amp=+$('amp').value;[['#68e0d1',y=>Math.sin(2*Math.PI*f1*y)],['#c1abff',y=>amp*Math.sin(2*Math.PI*f2*y+ph)],['#f0c883',y=>Math.sin(2*Math.PI*f1*y)+amp*Math.sin(2*Math.PI*f2*y+ph)]].forEach(([color,fn],i)=>{ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=i===2?3:1.8;for(let x=0;x<w;x++){const y=ht/2-fn(x/w)*ht/7;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()});$('waveInfo').textContent='Beat-frequency difference: '+format(Math.abs(f1-f2),5)+' Hz. Equal frequencies and opposite phase can cancel when amplitudes match.';for(const id of ['wf1','wf2','phase','amp'])$(id+'v').textContent=$(id).value};for(const id of ['wf1','wf2','phase','amp'])$(id).oninput=render;$('waveReset').onclick=()=>{for(const [id,v] of [['wf1',3],['wf2',3.5],['phase',0],['amp',1]])$(id).value=v;render()};render()},
spectrum:()=>{const run=()=>{let p=+$('logf').value,f=10**p,w=c/f,e=h*f/ev;$('logfv').textContent=p.toFixed(2);$('sFreq').textContent=freqFmt(f);$('sWave').textContent=w>=.001?format(w)+' m':format(w*1e9)+' nm';$('sEnergy').textContent=format(e)+' eV';$('sBand').textContent='Approximate spectral region: '+(f<3e9?'Radio':f<3e11?'Microwave':f<4e14?'Infrared':f<7.5e14?'Visible':f<3e16?'Ultraviolet':f<3e19?'X-ray':'Gamma ray')};$('logf').oninput=run;run()},
atoms:()=>{const s=$('atomSelect');transitions.forEach((a,i)=>s.add(new Option(a.name+' ('+a.symbol+')',i)));const run=()=>{const a=transitions[+s.value];$('atomDetail').innerHTML='<div class="grid"><div class="card"><div class="small">Atomic number</div><div class="metric">'+a.z+'</div><p>'+a.name+' · '+a.symbol+'</p></div><div class="card"><div class="small">Example transition</div><h3>'+a.transition+'</h3><p>'+freqFmt(a.freq)+'</p></div></div><p class="small">Status: '+a.quality+'. Source category: '+a.source+'.</p>'};s.onchange=run;run()},
quantum:()=>{const run=()=>{let up=+$('upper').value,low=+$('lower').value;low=Math.min(low,up-1);$('lower').value=low;$('upperV').textContent=up;$('lowerV').textContent=low;const energy=13.6*(1/(low*low)-1/(up*up)),f=energy*ev/h;$('qEnergy').textContent=format(energy,5)+' eV';$('qFreq').textContent=freqFmt(f);$('qWave').textContent=format(c/f*1e9,6)+' nm';let lines='';for(let n=1;n<=8;n++){const y=240-200*(1-1/(n*n));lines+='<line x1="55" y1="'+y+'" x2="255" y2="'+y+'" stroke="'+(n===up?'#c1abff':n===low?'#68e0d1':'#536781')+'" stroke-width="'+(n===up||n===low?3:1)+'"/><text x="20" y="'+(y+4)+'" font-size="12" fill="#cbd7e8">n='+n+'</text>'}const yu=240-200*(1-1/(up*up)),yl=240-200*(1-1/(low*low));$('energySvg').innerHTML=lines+'<path d="M300 '+yu+' V'+yl+'" stroke="#f0c883" stroke-width="3"/><path d="M293 '+(yl-10)+' L300 '+yl+' L307 '+(yl-10)+'" stroke="#f0c883" stroke-width="3" fill="none"/><text x="340" y="100" fill="#e7d4ff" font-size="15">Photon emission</text><text x="340" y="125" fill="#a8bbd4" font-size="12">Higher → lower state</text>'};$('upper').oninput=run;$('lower').oninput=run;run()},
transitions:()=>{const s=$('transitionSel');transitions.forEach((a,i)=>s.add(new Option(a.name+' — '+a.transition,i)));const run=()=>{const a=transitions[+s.value];$('transitionDetail').innerHTML='<div class="grid three"><div class="card"><div class="small">Frequency</div><div class="metric">'+freqFmt(a.freq)+'</div></div><div class="card"><div class="small">Vacuum wavelength</div><div class="metric">'+format(c/a.freq,8)+' m</div></div><div class="card"><div class="small">Photon energy</div><div class="metric">'+format(h*a.freq/ev,8)+' eV</div></div></div><p class="small">Transition: '+a.transition+'. '+a.quality+'.</p>'};s.onchange=run;run();document.querySelector('[data-go]').onclick=()=>mount('quantum')},
clocks:()=>{const run=()=>{$('offsetV').textContent=$('offset').value;$('clockFreq').textContent=format(9192631770+(+$('offset').value),12)+' Hz'};$('offset').oninput=run;$('correct').onclick=()=>{$('offset').value=0;run()};$('drift').onclick=()=>{$('offset').value=Math.min(100,+$('offset').value+10);run()};run()},
octaves:()=>{const s=$('octAtom');transitions.forEach((a,i)=>s.add(new Option(a.name+' — '+a.transition,i)));let audio=null,osc=null,gain=null;const stop=()=>{if(osc){try{osc.stop()}catch{}osc.disconnect();osc=null}if(gain){gain.disconnect();gain=null}};const run=()=>{let a=transitions[+s.value],lower=+$('octTarget').value,n=Math.floor(Math.log2(a.freq/lower)),shift=+$('octShift').value,pitch=a.freq/2**(n+shift);$('octTargetV').textContent=lower;$('octShiftV').textContent=shift;$('originalF').textContent=freqFmt(a.freq);$('octCount').textContent=n+shift;$('audibleF').textContent=format(pitch,13)+' Hz';const midi=69+12*Math.log2(pitch/440),nearest=Math.round(midi),cents=100*(midi-nearest);$('octDetails').textContent='Calculated using f / 2^'+(n+shift)+'. Nearest equal-tempered MIDI note: '+nearest+' ('+format(cents,5)+' cents deviation). The calculated frequency is not snapped to that note. If the additional shift moves outside the audible range, that is intentional.';if(osc)osc.frequency.setValueAtTime(pitch,audio.currentTime);return pitch};for(const id of ['octAtom','octTarget','octShift'])$(id).oninput=run;$('playTone').onclick=async()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();stop();osc=audio.createOscillator();gain=audio.createGain();gain.gain.value=.08;osc.type='sine';osc.frequency.value=run();osc.connect(gain).connect(audio.destination);osc.start()}catch(e){$('octDetails').textContent='Audio unavailable: '+e.message}};$('stopTone').onclick=stop;window.addEventListener('pagehide',stop,{once:true});run()},
math:()=>{const run=()=>{let f=+$('mathFreq').value;$('mathOut').textContent=f>0?'Period: '+format(1/f,10)+' s · Vacuum wavelength: '+format(c/f,10)+' m · Photon energy: '+format(h*f/ev,10)+' eV':'Enter a positive frequency.'};$('mathFreq').oninput=run;run()},
atlas:()=>{const concepts=[['Frequency','waves'],['Period','waves'],['Interference','waves'],['Light','spectrum'],['Photon','spectrum'],['Element','atoms'],['Isotope','atoms'],['Quantum state','quantum'],['Energy levels','quantum'],['Spectral line','transitions'],['Atomic clock','clocks'],['Octave reduction','octaves'],['Logarithm','math']];concepts.forEach(([name,id],i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+name+' →';b.onclick=()=>mount(id);$('conceptCards').append(b)})},
quiz:()=>{const qs=[['What happens to the period when frequency doubles?',['It halves','It doubles','It stays the same'],0,'T = 1/f.'],['What defines a chemical element?',['Number of protons','Number of neutrons','Its spectral color'],0,'Atomic number is proton count.'],['Does an element have only one transition frequency?',['No, many transitions are possible','Yes, exactly one','Only in vacuum'],0,'Different allowed energy-state pairs yield different frequencies.'],['Which transition defines the SI second?',['Cesium-133 hyperfine','Hydrogen H-alpha','Oxygen optical'],0,'The cesium-133 ground-state hyperfine frequency is exact by definition.'],['What does octave reduction do?',['Divides frequency by powers of two','Rounds to the nearest piano note','Converts photons into air pressure'],0,'It is a mathematical mapping, not a literal sound emitted by the atom.']];let idx=0,answered=false;const show=()=>{const q=qs[idx];$('questionBox').innerHTML='<h3>'+q[0]+'</h3>';q[1].forEach((choice,j)=>{const b=document.createElement('button');b.className='quiz-option';b.textContent=choice;b.onclick=()=>{if(answered)return;answered=true;const correct=j===q[2];store.answers.push({question:idx,correct,time:new Date().toISOString()});save();$('feedback').textContent=(correct?'Correct. ':'Not quite. ')+q[3];$('score').textContent=store.answers.filter(x=>x.correct).length+'/'+store.answers.length+' correct'};$('questionBox').append(b)});const p=document.createElement('p');p.id='feedback';p.className='result';p.setAttribute('aria-live','polite');$('questionBox').append(p)};$('nextQuestion').onclick=()=>{idx=(idx+1)%qs.length;answered=false;show()};$('score').textContent=store.answers.filter(x=>x.correct).length+'/'+store.answers.length+' correct';show()},
notes:()=>{const render=()=>{$('noteList').replaceChildren();store.notes.slice().reverse().forEach(n=>{const box=document.createElement('div');box.className='lesson';const t=document.createElement('div');t.className='small';t.textContent=n.time;const p=document.createElement('p');p.textContent=n.text;box.append(t,p);$('noteList').append(box)})};$('saveNote').onclick=()=>{const text=$('noteText').value.trim();if(!text)return;store.notes.push({text,time:new Date().toISOString()});save();$('noteText').value='';render()};$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='quantum-resonance-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('clearNotes').onclick=()=>{if(confirm('Permanently delete all notebook entries from this browser?')){store.notes=[];save();render()}};render()}
};
const nav=$('nav');modules.forEach(([id,title])=>{const b=document.createElement('button');b.textContent=title;b.dataset.id=id;b.onclick=()=>mount(id);nav.append(b)});mount('overview');
</script></body></html>
